name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Server tests
        working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Web lint and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Package release
        run: |
          tar -czf release.tar.gz \
            --exclude=server/node_modules \
            --exclude=server/tests \
            --exclude=server/data/store.json \
            server web/dist deploy

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

      - name: Upload and activate release
        run: |
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          REMOTE="$SSH_USER@$SSH_HOST"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes"
          scp $SSH_OPTS -P "$SSH_PORT" release.tar.gz "$REMOTE:/tmp/home-service-$RELEASE_ID.tar.gz"
          ssh $SSH_OPTS -p "$SSH_PORT" "$REMOTE" bash -s -- "$RELEASE_ID" <<'EOF'
          set -euo pipefail
          RELEASE_DIR="/var/www/home-service/releases/$1"
          ARCHIVE="/tmp/home-service-$1.tar.gz"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          rm -f "$ARCHIVE"
          bash "$RELEASE_DIR/deploy/remote-deploy.sh"
          EOF

      - name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://home-service-api.annaniks.com/api/health
          curl -fsS --retry 5 --retry-delay 3 -o /dev/null https://home-service.annaniks.com/

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
